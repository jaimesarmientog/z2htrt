# docs/restful-booker.openapi.yaml
#
# Hand-authored OpenAPI spec for the Restful-Booker API.
#
# Why this file exists: the live hosted API (restful-booker.herokuapp.com)
# does not expose a machine-readable OpenAPI/Swagger spec. Its /apidoc
# docs are generated by apiDoc (github.com/mwinteringham/restful-booker's
# own package.json: "build_docs": "apidoc -i ./routes/ -o public/apidoc/"),
# which produces static HTML, not a spec openapi-typescript can consume.
#
# This file is maintained by us and scoped ONLY to the endpoints crawl.ts
# actually needs: auth (required to obtain a token for the mutating
# booking endpoints) and the booking write operations. Field shapes are
# cross-confirmed against multiple independent, unrelated third-party
# test suites for this same public API.
#
# ⚠️ REVIEW: I could not execute live requests against the app from this
# environment (only GET /ping was reachable, to confirm the app is up).
# Before relying on this spec in the generation step, do a quick manual
# POST /auth + POST /booking + PUT/DELETE against the real app to confirm
# response shapes and status codes below, particularly the two flagged
# inline.

openapi: 3.0.3
info:
  title: Restful-Booker (hand-authored subset)
  version: "1.0.0"
  description: >
    Minimal spec covering only the auth and booking-mutation endpoints
    used by the Zero to Hero with TestRigor tutorial series.
servers:
  - url: https://restful-booker.herokuapp.com

paths:
  /auth:
    post:
      operationId: createToken
      summary: Authenticate and obtain a token for mutating booking endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /booking:
    post:
      operationId: createBooking
      summary: Create a new booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Booking"
      responses:
        "200":
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingResponse"

  /booking/{id}:
    put:
      operationId: updateBooking
      summary: Fully replace an existing booking. Requires an auth token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        # ⚠️ REVIEW: auth is passed as a Cookie header in every third-party
        # example I found (`Cookie: token=<token>`), not a Bearer token.
        # Confirm this is still accurate before generate.ts relies on it.
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
            example: "token=abc123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Booking"
      responses:
        "200":
          description: Booking updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "403":
          description: Missing or invalid auth token.

    delete:
      operationId: deleteBooking
      summary: Delete an existing booking. Requires an auth token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
            example: "token=abc123"
      responses:
        # ⚠️ REVIEW: sources agree the app frequently returns 201 for
        # operations that would conventionally be 200/204 (e.g. GET /ping
        # itself returns 201, confirmed live above). I have not been able
        # to independently confirm DELETE's exact status code here — some
        # third-party suites assert 201, but I don't have a fully
        # authoritative source for this one specifically. Verify directly.
        "201":
          description: Booking deleted.
        "403":
          description: Missing or invalid auth token.

components:
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string

    BookingDates:
      type: object
      required: [checkin, checkout]
      properties:
        checkin:
          type: string
          format: date
        checkout:
          type: string
          format: date

    Booking:
      type: object
      required: [firstname, lastname, totalprice, depositpaid, bookingdates]
      properties:
        firstname:
          type: string
        lastname:
          type: string
        totalprice:
          # ⚠️ REVIEW: multiple independent test suites report totalprice
          # loses precision if sent as a float (the API appears to coerce
          # it), so modeling as integer rather than number. Worth a quick
          # live check since this affects what Claude will assume is valid.
          type: integer
        depositpaid:
          type: boolean
        bookingdates:
          $ref: "#/components/schemas/BookingDates"
        additionalneeds:
          type: string

    CreateBookingResponse:
      type: object
      properties:
        bookingid:
          type: integer
        booking:
          $ref: "#/components/schemas/Booking"
name: Refine Generated Test Cases

# Job 3 of the companion repo pipeline.
# Runs automatically once a generation PR (from crawl-and-generate.yml,
# branch prefix `generated-tests/`) merges to main. Reads every approved
# test case in test-cases/generated/ with full cross-flow visibility and:
#   - extracts genuinely repeated step sequences into reusable rules
#   - replaces hardcoded base URLs with suite-level parameters, and
#     writes docs/test-data-needed.md listing what needs manual setup
#     in testRigor's Test Data section
# then opens a second PR for review.
#
# Trigger: pull_request closed+merged, filtered to only PRs whose head
# branch matches the generation PR's naming convention. That filter is
# what stops this from also firing on its own resulting PR (branch
# prefix refined-tests/, not generated-tests/) or on unrelated PRs.
on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  refine:
    name: Extract rules + parameterize test cases, open PR
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'generated-tests/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run refine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TESTRIGOR_APP_URL: "https://automationintesting.online"
          RESTFUL_BOOKER_API_BASE: "https://restful-booker.herokuapp.com"
        run: npm run refine

      # Computed explicitly from the checked-out main branch rather than
      # trusting github.sha/github.ref_name — under this pull_request
      # trigger those refer to the PR branch's head commit and a
      # PR-numbered ref (e.g. "123/merge"), not the resulting commit on
      # main, which is what should actually be tagged below.
      - name: Compute main branch info
        id: vars
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open PR with refined test cases
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: refined-tests/${{ steps.vars.outputs.short_sha }}-${{ github.run_id }}
          add-paths: |
            test-cases/**
            rules/**
            docs/test-data-needed.md
          commit-message: "Extract reusable rules and parameterize test cases (run ${{ github.run_id }})"
          title: "Refined test cases — run ${{ github.run_id }}"
          body: |
            Auto-generated by the agentic pipeline (Job 3), triggered automatically
            after PR #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}") merged.

            This extracts repeated step sequences into reusable rules and replaces
            hardcoded base URLs with suite-level parameters. See
            `docs/test-data-needed.md` for any new Test Data entries that need to
            be added manually in the testRigor UI before these tests can run.

            Merging this PR triggers Job 2 (push-and-run.yml).
          delete-branch: true

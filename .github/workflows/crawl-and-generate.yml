name: Agentic Test Case Pipeline

# Job 1 of the companion repo pipeline.
# Discovers the app surface (Playwright crawl + OpenAPI parse), then asks
# Claude to propose TestRigor test cases grounded in the vendored skill
# files. Opens a PR for human review — nothing is pushed to TestRigor
# directly from this workflow. Job 2 (push-and-run.yml) handles that,
# triggered separately once the PR is merged.
#
# Trigger: manual only. This does NOT run on push/merge to main, so there
# is no self-triggering loop with Job 2 and no merge-detection logic is
# needed.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  TESTRIGOR_APP_URL: "https://automationintesting.online"
  RESTFUL_BOOKER_API_BASE: "https://restful-booker.herokuapp.com"

jobs:
  crawl:
    name: Crawl app + parse API surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # ⚠️ REVIEW: Playwright needs its browser binaries installed
      # separately from npm packages. Scoping to chromium only since
      # that's almost certainly all crawl.ts will drive — confirm once
      # crawl.ts is actually implemented, in case it needs another engine.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run crawl
        run: npm run crawl

      # ⚠️ REVIEW: assumes crawl.ts writes to ./inventory.json at the repo
      # root, per its own doc comment. Confirm path once crawl.ts is built.
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: inventory.json
          retention-days: 1

  generate:
    name: Generate test cases with Claude + open PR
    needs: crawl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Download inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory
          path: .

      - name: Run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate

      # Computes a short SHA for the branch name. Relies on the checkout
      # step above already having fetched the commit into the working tree.
      - name: Compute short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open PR with generated test cases
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: generated-tests/${{ steps.vars.outputs.short_sha }}-${{ github.run_id }}
          add-paths: |
            test-cases/**
            rules/**
          commit-message: "Add generated TestRigor test cases (run ${{ github.run_id }})"
          title: "Generated test cases — run ${{ github.run_id }}"
          body: |
            Auto-generated by the agentic pipeline (Job 1), triggered manually
            from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            Please review each proposed test case before merging. Merging this
            PR triggers Job 2 (push-and-run.yml), which pushes these files to
            the TestRigor suite and runs them.
          delete-branch: true